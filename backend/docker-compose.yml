services:
  postgres:
    image: postgres:16-alpine
    container_name: kmestre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kmestre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kmestre}
      POSTGRES_DB: ${POSTGRES_DB:-kmestre}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: